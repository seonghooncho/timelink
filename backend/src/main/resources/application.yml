spring:
  application:
    name: planner-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

aws:
  region: ap-northeast-2
  dynamodb:
    endpoint: http://localhost:8000
    table-prefix: planner_
  s3:
    bucket-name:
    public-base-url:
  scheduler:
    group-name:
    target-arn:
    role-arn:

push:
  vapid:
    public-key:
    private-key:
  subject:

jwt:
  secret: your-256-bit-secret-key-for-local-dev-only-change-in-production
  expiration: 900000
  access-expiration: 900000
  refresh-expiration: 1209600000
  refresh-cookie-name: timelink_rt
  refresh-cookie-path: /api/planner/v1/auth
  refresh-cookie-same-site: Lax
  refresh-cookie-secure: false

oauth:
  google:
    client-id:
    client-secret:
  kakao:
    client-id:
    client-secret:

auth:
  dev-login-enabled: false

analytics:
  enabled: false
  hmac-secret: local-analytics-secret-change-in-production
  raw-bucket-name:
  admin-user-ids:
  api-metrics-enabled: true

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.planner: INFO
    com.amazonaws.serverless.proxy: WARN
    software.amazon.awssdk: WARN

spring.servlet.multipart:
  max-file-size: 15MB
  max-request-size: 15MB

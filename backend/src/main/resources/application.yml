spring:
  application:
    name: planner-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

aws:
  region: ap-northeast-2
  dynamodb:
    endpoint: http://localhost:8000
    table-prefix: planner_
  s3:
    bucket-name:
    public-base-url:

jwt:
  secret: your-256-bit-secret-key-for-local-dev-only-change-in-production
  expiration: 86400000

oauth:
  allowed-frontend-origins:
  public-api-base-url:
  google:
    client-id:
    client-secret:
  kakao:
    client-id:
    client-secret:

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.planner: DEBUG
    software.amazon.awssdk: INFO

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 5MB

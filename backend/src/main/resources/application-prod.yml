spring:
  application:
    name: planner-backend

aws:
  region: ${AWS_REGION:ap-northeast-2}
  dynamodb:
    table-prefix: ${DYNAMODB_TABLE_PREFIX:planner_prod_}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

cors:
  allowed-origins: ${CORS_ORIGINS:https://your-domain.com}

logging:
  level:
    com.planner: INFO
